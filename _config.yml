name: notSatoshi
description: >
  Smart contract security research and EVM bug bounty writeups —
  reentrancy, access control, oracle manipulation, broken invariants.
about: >
  Independent smart contract security researcher focused on the EVM.
  I break protocols before attackers do and publish the findings here as
  writeups with reproducible proofs of concept. Reach me on X @0xunsatoshi.
  Responsible disclosure only — no unauthorized testing.

