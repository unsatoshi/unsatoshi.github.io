---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date_to_string }}{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</p>

  {{ content }}

  {% if site.owner.twitter %}
  <p class="post-share">
    <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&amp;via={{ site.owner.twitter }}" target="_blank" rel="noopener">Discuss on X &rarr;</a>
  </p>
  {% endif %}
</article>
